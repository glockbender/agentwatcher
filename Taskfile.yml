version: "3"

tasks:
  build:
    desc: Build all targets with warnings treated as errors
    cmds:
      - swift build -Xswiftc -warnings-as-errors

  test:
    desc: Run unit tests
    cmds:
      - swift build --product AgentWatchSend -Xswiftc -warnings-as-errors
      - swift test --parallel -Xswiftc -warnings-as-errors

  lint:
    desc: Check Swift formatting and style
    cmds:
      - swift format lint --configuration .swift-format --recursive --parallel --strict Sources Tests
      - swift format lint --configuration .swift-format --strict Package.swift

  format:
    desc: Format Swift sources
    cmds:
      - swift format --configuration .swift-format --in-place --recursive --parallel Sources Tests
      - swift format --configuration .swift-format --in-place Package.swift

  verify:
    desc: Run all local quality gates
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: build-release
      - task: build-app

  build-release:
    desc: Build release targets with warnings treated as errors
    cmds:
      - swift build -c release -Xswiftc -warnings-as-errors

  build-app:
    desc: Assemble the local app bundle, signed with the local development certificate
    cmds:
      # Release, because this bundle is the one a person installs and runs, and the debug
      # configuration defines AGENT_WATCH_DEBUG_CAPTURE — the menu items that write raw hook
      # payloads to disk. For a bundle that has them: ./scripts/build-app.sh debug
      - ./scripts/build-app.sh release

  release:
    desc: Package the release zip and its checksum from the app bundle
    cmds:
      # Signs with AGENT_WATCH_RELEASE_IDENTITY when it names a Developer ID certificate and
      # ad-hoc when it does not — never with the local development certificate, which means
      # nothing to anybody who downloads the result.
      - ./scripts/release.sh

  verify-all:
    desc: Every check this machine can run, including the ones that need the network and a screen
    cmds:
      - task: verify
      - task: probe-update
      # Without an IDE installed here the plugin build would download one, and the end-to-end
      # update needs a screen and Accessibility permission. Neither is right for every machine
      # that clones this repository, so each says why it is skipped rather than failing the run.
      # The same four paths `build.gradle.kts` looks at, kept in step by hand.
      - |
        if [ -d "$HOME/Applications/GoLand.app" ] || [ -d "/Applications/GoLand.app" ] \
          || [ -d "$HOME/Applications/IntelliJ IDEA.app" ] || [ -d "/Applications/IntelliJ IDEA.app" ]; then
          task plugin-check
        else
          echo "skipped: no JetBrains IDE installed here — 'task plugin-download' builds against"
          echo "         one Gradle fetches, which costs about two gigabytes the first time"
        fi
      - |
        if [ -n "${CI:-}" ]; then
          echo "skipped: the end-to-end update needs a screen and Accessibility permission"
        elif [ -n "${SKIP_E2E:-}" ]; then
          echo "skipped: SKIP_E2E is set"
        else
          task e2e-update
        fi

  probe-update:
    desc: Download the published release and unpack it, to check the half no unit test reaches
    cmds:
      # Talks to GitHub, so it is not part of `task verify`: that gate must pass on a machine
      # with no network.
      - UPDATE_PROBE_DIR="$(mktemp -d)" swift test --filter AppUpdateProbe

  e2e-update:
    desc: Update a throwaway copy of the app end to end, dialogs included
    cmds:
      # Builds an older version in a temporary folder, starts it against a published release,
      # presses the buttons through the accessibility tree, and checks what landed on disk.
      # Needs the terminal to have Accessibility permission — macOS asks once.
      - ./scripts/e2e-update.sh {{.CLI_ARGS}}

  plugin-check:
    desc: Build and test the JetBrains IDE plugin without staging it (the push gate's half)
    dir: ide-plugin
    cmds:
      # Built against an IDE already installed on this machine. Another product:
      # ./gradlew buildPlugin -Pagentwatch.ide.path=/Applications/PyCharm.app
      - ./gradlew test buildPlugin

  plugin-verify:
    desc: Verify the IDE plugin against the oldest supported platform and the build platform
    dir: ide-plugin
    cmds:
      # Downloads are cached. To reproduce one member: task plugin-verify -- -Pagentwatch.verify.versions=2025.1
      - ./gradlew test buildPlugin verifyPlugin {{.CLI_ARGS}}

  plugin:
    desc: Build the JetBrains IDE plugin and put it where Agent Watch offers it to IDEs
    dir: ide-plugin
    cmds:
      # `stagePlugin` puts the built file where Agent Watch looks for it. It is a Gradle task
      # rather than a copy here, so the file comes from the packaging task itself instead of
      # from the newest name in a directory that keeps every version ever built. Not part of
      # the push gate: the staged file may be a signed release, and the gate must not replace
      # it with an unsigned local build under the same name.
      - ./gradlew test buildPlugin stagePlugin

  plugin-download:
    desc: Build the IDE plugin against an IDE Gradle fetches, rather than one installed here
    dir: ide-plugin
    cmds:
      # For a machine with no IDE, and for checking that path on a machine that has one.
      - ./gradlew test buildPlugin stagePlugin -Pagentwatch.ide.download=true

  build-sender:
    desc: Build the fail-open local hook sender
    cmds:
      - swift build --product AgentWatchSend -Xswiftc -warnings-as-errors

  run:
    desc: Run Agent Watch from Swift Package Manager
    cmds:
      - swift run AgentWatch

  setup:
    desc: Configure repository-local Git hooks
    cmds:
      - git config core.hooksPath .githooks

  doctor:
    desc: Show the local Swift and Apple developer toolchain
    cmds:
      - swift --version
      - xcode-select -p
      - swift format --version
