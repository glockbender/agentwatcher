version: "3"

tasks:
  build:
    desc: Build all targets with warnings treated as errors
    cmds:
      - swift build -Xswiftc -warnings-as-errors

  test:
    desc: Run unit tests
    cmds:
      # The sender is an executable the tests look for on disk, so it is built first — and
      # by the task that owns that command, rather than by a second copy of it here.
      - task: build-sender
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/devtool/Cargo.toml
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/git-protection-e2e/Cargo.toml
      - python3 -B scripts/test-setup-git-hooks.py
      - swift test --parallel -Xswiftc -warnings-as-errors
      - task: test-native-git

  test-native-git:
    desc: Test the Git hook and the one-shot confirmation executable
    cmds:
      - python3 -B scripts/test-git-guard.py
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/git-protection/Cargo.toml
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/git-protection/Cargo.toml --profile fixture --features mcp-fixture --test push --test protocol -- --test-threads=2

  test-git-windows:
    desc: Rehearse cancelling deletion of a feature branch and the default branch in real macOS windows
    cmds:
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/git-protection/Cargo.toml --profile fixture --features mcp-fixture --test push rehearse_deletion_with_native_windows -- --ignored --exact --nocapture

  test-git-window-cancellation:
    desc: Check that real confirmation windows close when the caller stops
    cmds:
      - CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/.build/devtool}" rustup run 1.98.1 cargo test --locked --manifest-path native/git-protection/Cargo.toml --profile fixture --features mcp-fixture --test push native_window_cancellation_disconnect_and_server_death_never_push -- --ignored --exact --nocapture

  test-cli-close:
    desc: Verify chat closure in both real clients inside a disposable macOS guest
    cmds:
      - ./scripts/devtool test-cli-close

  test-git-upgrade:
    desc: Verify both clients keep their rules across bundle replacement and a missing bundle, inside a disposable macOS guest
    requires:
      vars: [AGENT_WATCH_TEST_BUNDLE]
    cmds:
      - ./scripts/devtool test-git-upgrade

  lint:
    desc: Check Swift formatting and style, the shape of TROUBLESHOOTING.md, the documents, and the list of measurements
    cmds:
      - swift format lint --configuration .swift-format --recursive --parallel --strict Sources Tests WidgetExtension
      - swift format lint --configuration .swift-format --strict Package.swift
      - ./scripts/devtool check-troubleshooting
      - ./scripts/devtool check-docs
      - ./scripts/devtool measurements --check

  measurements:
    desc: Rebuild docs/measurements.md from the version markers next to each measured fact
    cmds:
      - ./scripts/devtool measurements

  format:
    desc: Format Swift sources
    cmds:
      - swift format --configuration .swift-format --in-place --recursive --parallel Sources Tests WidgetExtension
      - swift format --configuration .swift-format --in-place Package.swift

  verify:
    desc: Run all local quality gates
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: build-release
      - task: build-app

  build-release:
    desc: Build release targets with warnings treated as errors
    cmds:
      - swift build -c release -Xswiftc -warnings-as-errors

  build-app:
    desc: Assemble the local app bundle, signed with the local development certificate
    cmds:
      # Release, because this bundle is the one a person installs and runs, and the debug
      # configuration defines AGENT_WATCH_DEBUG_CAPTURE — the menu items that write raw hook
      # payloads to disk. For a bundle that has them: ./scripts/build-app.sh debug
      - ./scripts/devtool build-app release

  release:
    desc: Package the release zip and disk image with their checksums, and the update feed when SPARKLE_PRIVATE_KEY is set
    cmds:
      # Signs with AGENT_WATCH_RELEASE_IDENTITY when it names a Developer ID certificate and
      # ad-hoc when it does not — never with the local development certificate, which means
      # nothing to anybody who downloads the result.
      - ./scripts/devtool release

  verify-all:
    desc: Every check this machine can run, including the ones that need the network and a screen
    cmds:
      - task: verify
      - task: probe-update
      - ./scripts/devtool ci local-plugin

  readme-images:
    desc: Redraw the README's pictures into docs/images, offscreen
    cmds:
      # The probes refuse to draw unless a Retina display is the main one: pictures drawn at
      # one pixel per point look soft on every Retina screen that opens the README.
      - DOC_RENDER_DIR=docs/images swift test --filter DocumentationRenderProbe

  readme-menu:
    desc: Take the README's picture of the menu from a real menu, open on screen for a second
    cmds:
      # Keep the pointer away from the menu, or a line under it is highlighted. macOS asks
      # once for Screen Recording permission.
      - MENU_RENDER_DIR=docs/images swift test --filter ReadmeMenuProbe

  probe-update:
    desc: Download the published release as installed copies will, to check the half no unit test reaches
    cmds:
      # Talks to GitHub, so it is not part of `task verify`: that gate must pass on a machine
      # with no network.
      - ./scripts/devtool probe-release

  e2e-update:
    desc: Update a copy of the app end to end in a clean macOS, failures included — before a release
    cmds:
      # A few minutes, in a throwaway clone of the Tart machine aw-golden; nothing opens on this
      # Mac's screen. Not in verify-all for that reason: the release skill runs it before a tag.
      - ./scripts/devtool e2e-update

  plugin-check:
    desc: Build and test the JetBrains IDE plugin without staging it (the push gate's half)
    dir: ide-plugin
    cmds:
      # Built against an IDE already installed on this machine. Another product:
      # ./gradlew buildPlugin -Pagentwatch.ide.path=/Applications/PyCharm.app
      - ./gradlew test buildPlugin

  plugin-verify:
    desc: Verify the IDE plugin against the oldest supported platform and the build platform
    dir: ide-plugin
    cmds:
      # Downloads are cached. To reproduce one member: task plugin-verify -- -Pagentwatch.verify.versions=2025.1
      - ./gradlew test buildPlugin verifyPlugin {{.CLI_ARGS}}

  plugin:
    desc: Build the JetBrains IDE plugin and put it where Agent Watch offers it to IDEs
    dir: ide-plugin
    cmds:
      # `stagePlugin` puts the built file where Agent Watch looks for it. It is a Gradle task
      # rather than a copy here, so the file comes from the packaging task itself instead of
      # from the newest name in a directory that keeps every version ever built. Not part of
      # the push gate: the staged file may be a signed release, and the gate must not replace
      # it with an unsigned local build under the same name.
      - ./gradlew test buildPlugin stagePlugin

  plugin-download:
    desc: Build the IDE plugin against an IDE Gradle fetches, rather than one installed here
    dir: ide-plugin
    cmds:
      # For a machine with no IDE, and for checking that path on a machine that has one.
      - ./gradlew test buildPlugin stagePlugin -Pagentwatch.ide.download=true

  build-sender:
    desc: Build the fail-open local hook sender
    cmds:
      - swift build --product AgentWatchSend -Xswiftc -warnings-as-errors

  dev:
    desc: Build and open Agent Watch Dev with its own data and no Git integration
    cmds:
      - ./scripts/devtool dev

  dev:git:
    desc: Build and open Dev with Git protection in isolated Claude and Codex profiles
    cmds:
      - ./scripts/devtool dev --git

  run:
    desc: Run the isolated developer app
    cmds:
      - task: dev

  setup:
    desc: Install the Git gates so that every worktree runs the hooks of its own branch
    cmds:
      - python3 -B scripts/setup-git-hooks.py

  doctor:
    desc: Show the local Swift and Apple developer toolchain
    cmds:
      - swift --version
      - xcode-select -p
      - swift format --version
