name: publish-plugin

# The plugin is versioned apart from the application, so it has a tag of its own:
# `plugin-vX.Y.Z`. The tag decides nothing about what is built — `version` in
# `ide-plugin/build.gradle.kts` does — so the two have to agree, or the job stops before it
# has built anything.
#
# Started by hand, the job stops after signing and leaves the signed file as an artifact of
# the run. That is how the first version — which Marketplace takes only through its site —
# gets signed without the key ever being on a laptop.
on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:

concurrency:
  group: publish-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag and build.gradle.kts agree on the version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#plugin-v}"
          build_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' ide-plugin/build.gradle.kts)"
          if [[ "$tag_version" != "$build_version" ]]; then
            echo "tag $GITHUB_REF_NAME says $tag_version, ide-plugin/build.gradle.kts says $build_version" >&2
            exit 1
          fi

      # Only to start Gradle: the build fetches the JDK the target IDE needs by itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # No IDE on a runner, so Gradle fetches one — the path `task plugin-download` exercises
      # locally. `verifyPlugin` is the check `build.gradle.kts` asks for before publishing.
      # `signPlugin` runs by itself in front of `publishPlugin` once the three signing secrets
      # are set, and `publishPlugin` refuses a plugin Marketplace has never seen: the first
      # version is uploaded by hand — `docs/distribution.md` says how.
      - name: Test, verify, sign and publish
        working-directory: ide-plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew test verifyPlugin ${{ github.event_name == 'push' && 'publishPlugin' || 'signPlugin' }} -Pagentwatch.ide.download=true

      # The file Marketplace received — or, on a manual run, the file to hand to it.
      - name: Keep the signed file
        uses: actions/upload-artifact@v4
        with:
          name: agent-watch-ide
          path: ide-plugin/build/signed/*.zip
