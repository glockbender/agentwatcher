name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Both systems the app is used on: they lay out the same windows differently.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          swift --version
          xcode-select -p
          swift format --version

      # The repository gate is `task verify`, so CI runs that one command rather
      # than a second list of steps that can drift away from it.
      - name: Install Task
        run: brew install go-task

      - name: Verify
        run: task verify

      # Diagnostic, for this branch only: the settings pages as each system draws them.
      - name: Draw the settings pages
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          SETTINGS_RENDER_DIR="$RUNNER_TEMP/render" swift test --filter SettingsRenderProbe

      - name: Keep the drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-render-${{ matrix.os }}
          path: ${{ runner.temp }}/render
