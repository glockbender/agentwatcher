name: release

# A release is cut by pushing a tag, and the tag is the only thing that decides which version
# is built: the bundle's own `CFBundleShortVersionString` has to agree with it, or the job
# stops before it has built anything. A release whose file name and About box disagree is the
# kind of mistake that is only found by the person who downloaded it.
on:
  push:
    tags: ["v*"]

# Enough to create the release, and measured: the repository's default token is read-only,
# and this block still grants the write — the repository setting is the default, not a ceiling.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag and the bundle agree on the version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [[ "$tag_version" != "$bundle_version" ]]; then
            echo "tag $GITHUB_REF_NAME says $tag_version, Resources/Info.plist says $bundle_version" >&2
            exit 1
          fi

      # What changed has to be written before anything is built: the draft's notes and the
      # update window both read this section, and a release without it has nothing to say.
      - name: Check that CHANGELOG.md describes this version
        run: python3 scripts/changelog.py check "${GITHUB_REF_NAME#v}"

      # Installed copies accept a build only when its EdDSA signature matches the key they carry,
      # so a release without the key, or with a key the bundle does not know, reaches nobody.
      - name: Check that the update signing key is set up
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "the SPARKLE_PRIVATE_KEY secret is not set — docs/distribution.md, «Ключ подписи обновлений»" >&2
            exit 1
          fi
          plutil -extract SUPublicEDKey raw -o - Resources/Info.plist >/dev/null \
            || { echo "Resources/Info.plist has no SUPublicEDKey" >&2; exit 1; }

      - name: Install Task
        run: brew install go-task

      # The same gate as every push, run again here: a tag can point at any commit, including
      # one that never went through a pull request.
      - name: Verify
        run: task verify

      # Also signs the archive and writes appcast.xml, after checking the key against the bundle.
      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: task release

      # A draft, not a published release. What is in the notes and whether the world sees it
      # are decisions for a person, and a draft is the only way this job can leave them one.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/release-notes.sh "$version" > dist/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Agent Watch $version" \
            --notes-file dist/notes.md \
            "dist/AgentWatch-$version.dmg" \
            "dist/AgentWatch-$version.dmg.sha256" \
            "dist/AgentWatch-$version.zip" \
            "dist/AgentWatch-$version.zip.sha256" \
            dist/appcast.xml
