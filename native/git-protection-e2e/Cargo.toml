[package]
name = "agent-watch-git-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Isolated development checks for Agent Watch Git protection"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
tiny_http = "0.12"
shlex = "1.3"

[target.'cfg(windows)'.dependencies]
dunce = "1.0"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
