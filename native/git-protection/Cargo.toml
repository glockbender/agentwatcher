[package]
name = "agent-watch-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native one-shot Git push confirmations for Codex and Claude Code"
publish = false

[features]
# Test driver for the Git transaction matrix; deployment builds use the CLI only.
mcp-fixture = []

[[test]]
name = "push"
required-features = ["mcp-fixture"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
nix = { version = "0.31.2", default-features = false, features = ["fs", "poll", "process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSRunningApplication", "NSResponder", "NSView", "NSControl", "NSTextField", "NSButton", "NSWindow", "NSPanel", "NSCell"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Keep the simulated confirmation executable separate from concurrent production builds.
[profile.fixture]
inherits = "dev"
